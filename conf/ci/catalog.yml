# Środowisko ci: kedro run --env ci (base + ci).
# Te same pipeline'y na próbce z repozytorium. Wyjścia trafiają do osobnych plików,
# żeby uruchomienie w trybie ci nie nadpisało lokalnego modelu i metryk z pełnych danych.

raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/sample.csv

prepared_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/prepared_data_ci.csv
  save_args:
    index: false

model:
  type: pickle.PickleDataset
  filepath: data/06_models/model_ci.pkl

metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/metrics_ci.json
  save_args:
    indent: 2
    ensure_ascii: false
